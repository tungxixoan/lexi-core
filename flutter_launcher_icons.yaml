# LexiCore app icon — the Bloom leaf mark (see docs/superpowers/specs/2026-09-04-sp8-app-icon-design.md).
# Master art is generated by `node scripts/gen-icons.mjs` from the Bloom colour
# tokens. Regenerate + re-run `dart run flutter_launcher_icons` if a token changes.
flutter_launcher_icons:
  image_path: "assets/branding/icon-master.png"

  android: true
  adaptive_icon_background: "#FFF3EE"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"

  ios: true
  remove_alpha_ios: true
  # No `web:` — Flutter Web was retired 2026-09-05 (the React app at apps/web/
  # is now the only web client). The React favicon/PWA icons are generated by
  # scripts/gen-icons.mjs directly.
